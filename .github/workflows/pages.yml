# Builds the game from src/ on every push to main and publishes it to GitHub Pages.
# The live game is always built fresh, so a stale or conflicted dist/pet-park.html in git does not matter.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Same layout as the repo, so existing links and home-screen icons keep working.
      - run: |
          mkdir -p _site/dist
          cp index.html .nojekyll _site/
          cp dist/pet-park.html _site/dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
